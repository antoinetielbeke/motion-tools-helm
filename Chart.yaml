apiVersion: v2
name: motion-tools
description: A Helm chart for Motion Tools (Antragsgruen) - an online tool for NGOs and political parties to manage motions, resolutions and amendments
type: application
version: 1.0.0
appVersion: "4.17.0-volt.3"
kubeVersion: ">=1.19.0-0"
keywords:
  - motion
  - politics
  - amendments
  - antragsgruen
  - voting
icon: https://motion.tools/favicons/favicon-32x32.png
deprecated: false
annotations:
  "helm.sh/single-instance": "true"
  "helm.sh/notes": "Motion Tools requires single instance deployment."
  artifacthub.io/category: "integration-delivery"
  artifacthub.io/license: "MIT"
  artifacthub.io/alternativeName: "motion-tools-antragsgruen"
  artifacthub.io/readme: "true"
  artifacthub.io/repository: "https://dl.cloudsmith.io/public/tielbeke/tielbeke/helm/charts/"
  artifacthub.io/links: |
    - name: Motion Tools Website
      url: https://motion.tools
    - name: Documentation
      url: https://github.com/CatoTH/antragsgruen/wiki
    - name: Support
      url: https://github.com/CatoTH/antragsgruen/issues
  artifacthub.io/images: |
    - name: motion-tools-php
      image: ghcr.io/antoinetielbeke/motion-tools-php:4.17.0-volt.3
      platforms:
        - linux/amd64
        - linux/arm64
    - name: motion-tools-nginx
      image: ghcr.io/antoinetielbeke/motion-tools-nginx:4.17.0-volt.3
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/maintainers: |
    - name: Antoine Tielbeke
      email: antoine@tielbeke.io
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: Migrated from monolithic Apache+PHP image to two-container sidecar (PHP-FPM + NGINX)"
    - kind: changed
      description: "BREAKING: Replaced motionTools config section with app section using environment variables"
    - kind: changed
      description: "BREAKING: Split persistence into runtime and assets volumes"
    - kind: added
      description: "Added RANDOM_SEED requirement and secret management"
    - kind: added
      description: "Added native environment variable support for all app settings"
    - kind: removed
      description: "Removed PHP ConfigMap (configuration now baked into image)"
    - kind: changed
      description: "Updated to Antragsgruen v4.17-volt with 12-factor environment variable support"
home: https://motion.tools
sources:
  - https://github.com/CatoTH/antragsgruen
maintainers:
  - name: Antoine Tielbeke
    email: antoine@tielbeke.io
dependencies:
  - name: mariadb
    version: "0.12.1"
    repository: oci://registry-1.docker.io/cloudpirates
    condition: mariadb.enabled
  - name: valkey
    version: "0.15.0"
    repository: oci://registry-1.docker.io/cloudpirates
    condition: valkey.enabled
