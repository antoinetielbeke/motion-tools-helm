name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Update chart dependencies
        run: helm dependency update

      - name: Helm lint
        run: helm lint .

      - name: Helm template (validates rendering)
        run: |
          helm template motion-tools . \
            --set app.randomSeed="ci-test-seed-not-real" \
            > /dev/null
