{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "motion-tools.fullname" . }}
  labels:
    {{- include "motion-tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "motion-tools.selectorLabels" . | nindent 6 }}
  {{- with .Values.networkPolicy.policyTypes }}
  policyTypes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and (has "Ingress" .Values.networkPolicy.policyTypes) }}
  ingress:
    {{- if .Values.networkPolicy.ingress }}
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    # Default: Allow ingress on HTTP port (NGINX container)
    - ports:
      - protocol: TCP
        port: 80
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- else }}
      from: []
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if and (has "Egress" .Values.networkPolicy.policyTypes) }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    # Allow DNS
    - ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53
    # Allow database connection
    - ports:
      - protocol: TCP
        port: {{ include "motion-tools.databasePort" . }}
      to:
      - podSelector:
          matchLabels:
            {{- if .Values.mariadb.enabled }}
            app.kubernetes.io/name: mariadb
            app.kubernetes.io/instance: {{ .Release.Name }}
            {{- else }}
            {}
            {{- end }}
    {{- if .Values.valkey.enabled }}
    # Allow Valkey/Redis connection
    - ports:
      - protocol: TCP
        port: {{ .Values.valkey.service.port | default 6379 }}
      to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: valkey
            app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    # Allow HTTPS and SMTP
    - ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 587
      - protocol: TCP
        port: 465
      - protocol: TCP
        port: 25
    {{- end }}
  {{- end }}
{{- end }}
