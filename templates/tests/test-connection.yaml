apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "motion-tools.fullname" . }}-test-connection"
  labels:
    {{- include "motion-tools.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "motion-tools.fullname" . }}:{{ .Values.service.port }}/health', '-O', '/dev/null', '-q']
  restartPolicy: Never
