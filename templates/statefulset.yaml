{{- if and (not .Values.app.randomSeed) (not .Values.app.existingSecretRandomSeed) }}
{{- fail "app.randomSeed is required. Generate with: openssl rand -base64 32. Alternatively, set app.existingSecretRandomSeed to use an existing secret." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "motion-tools.fullname" . }}
  labels:
    {{- include "motion-tools.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "motion-tools.fullname" . }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "motion-tools.selectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "motion-tools.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "motion-tools.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      initContainers:
        # Copy static web files from PHP image to shared emptyDir for NGINX
        - name: copy-static-files
          image: {{ include "motion-tools.phpImage" . }}
          imagePullPolicy: {{ .Values.images.php.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Copying static web files to shared volume..."
              cp -a /var/www/html/web/. /static-files/
              echo "Static files copied successfully!"
          volumeMounts:
            - name: static-files
              mountPath: /static-files
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        # PHP-FPM container
        - name: php-fpm
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "motion-tools.phpImage" . }}
          imagePullPolicy: {{ .Values.images.php.pullPolicy }}
          ports:
            - name: php-fpm
              containerPort: 9000
              protocol: TCP
          env:
            # Required: Security seed
            - name: RANDOM_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.randomSeedSecretName" . }}
                  key: {{ .Values.app.randomSeedSecretKey | default "random-seed" }}

            # Database configuration
            - name: DB_HOST
              value: {{ include "motion-tools.databaseHost" . | quote }}
            - name: DB_PORT
              value: {{ include "motion-tools.databasePort" . | quote }}
            - name: DB_NAME
              value: {{ include "motion-tools.databaseName" . | quote }}
            - name: DB_USER
              value: {{ include "motion-tools.databaseUser" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.databaseSecretName" . }}
                  key: {{ include "motion-tools.databaseSecretPasswordKey" . }}

            # Application configuration
            - name: APP_DOMAIN
              value: {{ .Values.app.domain | quote }}
            - name: APP_PROTOCOL
              value: {{ .Values.app.protocol | default "https" | quote }}
            - name: BASE_LANGUAGE
              value: {{ .Values.app.baseLanguage | default "en" | quote }}
            - name: MULTISITE_MODE
              value: {{ .Values.app.multisiteMode | quote }}
            - name: RUN_MIGRATIONS
              value: {{ .Values.app.runMigrations | quote }}

            {{- if not .Values.app.multisiteMode }}
            # Single-site configuration
            - name: SITE_SUBDOMAIN
              value: {{ .Values.app.singleSite.subdomain | default "std" | quote }}
            - name: SITE_TITLE
              value: {{ .Values.app.singleSite.title | default "Demo Site" | quote }}
            - name: CONSULTATION_PATH
              value: {{ .Values.app.singleSite.consultationPath | default "main" | quote }}
            - name: CONSULTATION_TITLE
              value: {{ .Values.app.singleSite.consultationTitle | default "Main Consultation" | quote }}
            - name: CONSULTATION_TITLE_SHORT
              value: {{ .Values.app.singleSite.consultationTitleShort | default "Main" | quote }}
            {{- end }}

            {{- if .Values.valkey.enabled }}
            # Redis/Valkey configuration
            - name: REDIS_HOST
              value: {{ include "motion-tools.valkeyHost" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.valkey.service.port | default 6379 | quote }}
            {{- if .Values.valkey.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.valkeySecretName" . }}
                  key: {{ .Values.valkey.auth.existingSecretPasswordKey | default "password" }}
            {{- end }}
            {{- end }}

            # Mail configuration
            {{- if .Values.app.mailerDsn }}
            - name: MAILER_DSN
              value: {{ .Values.app.mailerDsn | quote }}
            {{- else if .Values.app.smtp.enabled }}
            - name: MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.smtpSecretName" . }}
                  key: mailer-dsn
            {{- end }}

            {{- if .Values.app.mail.fromEmail }}
            - name: MAIL_FROM_EMAIL
              value: {{ .Values.app.mail.fromEmail | quote }}
            {{- end }}
            {{- if .Values.app.mail.fromName }}
            - name: MAIL_FROM_NAME
              value: {{ .Values.app.mail.fromName | quote }}
            {{- end }}

            {{- if .Values.app.oidc.enabled }}
            # OIDC / SSO Configuration
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.oidcSecretName" . }}
                  key: {{ .Values.app.oidc.clientIdSecretKey | default "oidc-client-id" }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.oidcSecretName" . }}
                  key: {{ .Values.app.oidc.clientSecretSecretKey | default "oidc-client-secret" }}
            - name: OIDC_ISSUER
              value: {{ .Values.app.oidc.issuer | quote }}
            {{- if .Values.app.oidc.redirectUri }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.app.oidc.redirectUri | quote }}
            {{- end }}
            {{- if .Values.app.oidc.scopes }}
            - name: OIDC_SCOPES
              value: {{ .Values.app.oidc.scopes | quote }}
            {{- end }}
            {{- if .Values.app.oidc.pkce }}
            - name: OIDC_PKCE
              value: {{ .Values.app.oidc.pkce | quote }}
            {{- end }}
            {{- if .Values.app.oidc.singleLogout }}
            - name: OIDC_SINGLE_LOGOUT
              value: {{ .Values.app.oidc.singleLogout | quote }}
            {{- end }}
            {{- if .Values.app.oidc.syncGroups }}
            - name: OIDC_SYNC_GROUPS
              value: {{ .Values.app.oidc.syncGroups | quote }}
            {{- end }}
            {{- if .Values.app.oidc.discovery }}
            - name: OIDC_DISCOVERY
              value: {{ .Values.app.oidc.discovery | quote }}
            {{- end }}
            {{- if .Values.app.oidc.linkByEmail }}
            - name: OIDC_LINK_BY_EMAIL
              value: {{ .Values.app.oidc.linkByEmail | quote }}
            {{- end }}
            {{- if .Values.app.oidc.urlAuthorize }}
            - name: OIDC_URL_AUTHORIZE
              value: {{ .Values.app.oidc.urlAuthorize | quote }}
            {{- end }}
            {{- if .Values.app.oidc.urlToken }}
            - name: OIDC_URL_TOKEN
              value: {{ .Values.app.oidc.urlToken | quote }}
            {{- end }}
            {{- if .Values.app.oidc.urlUserinfo }}
            - name: OIDC_URL_USERINFO
              value: {{ .Values.app.oidc.urlUserinfo | quote }}
            {{- end }}
            {{- if .Values.app.oidc.urlLogout }}
            - name: OIDC_URL_LOGOUT
              value: {{ .Values.app.oidc.urlLogout | quote }}
            {{- end }}
            {{- if .Values.app.oidc.attrEmail }}
            - name: OIDC_ATTR_EMAIL
              value: {{ .Values.app.oidc.attrEmail | quote }}
            {{- end }}
            {{- if .Values.app.oidc.attrUsername }}
            - name: OIDC_ATTR_USERNAME
              value: {{ .Values.app.oidc.attrUsername | quote }}
            {{- end }}
            {{- if .Values.app.oidc.attrGivenName }}
            - name: OIDC_ATTR_GIVEN_NAME
              value: {{ .Values.app.oidc.attrGivenName | quote }}
            {{- end }}
            {{- if .Values.app.oidc.attrFamilyName }}
            - name: OIDC_ATTR_FAMILY_NAME
              value: {{ .Values.app.oidc.attrFamilyName | quote }}
            {{- end }}
            {{- if .Values.app.oidc.attrGroups }}
            - name: OIDC_ATTR_GROUPS
              value: {{ .Values.app.oidc.attrGroups | quote }}
            {{- end }}
            {{- if .Values.app.oidc.groupMapping }}
            - name: OIDC_GROUP_MAPPING
              valueFrom:
                secretKeyRef:
                  name: {{ include "motion-tools.oidcSecretName" . }}
                  key: {{ .Values.app.oidc.groupMappingSecretKey | default "oidc-group-mapping" }}
            {{- end }}
            {{- end }}

            {{- with .Values.app.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.app.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          livenessProbe:
            tcpSocket:
              port: php-fpm
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: php-fpm
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            tcpSocket:
              port: php-fpm
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          {{- with .Values.php.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            {{- if .Values.persistence.runtime.enabled }}
            - name: runtime
              mountPath: /var/www/html/runtime
            {{- end }}
            {{- if .Values.persistence.assets.enabled }}
            - name: assets
              mountPath: /var/www/html/web/assets
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        # NGINX container (sidecar)
        - name: nginx
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "motion-tools.nginxImage" . }}
          imagePullPolicy: {{ .Values.images.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: PHP_FPM_HOST
              value: "localhost"
            - name: PHP_FPM_PORT
              value: "9000"
            - name: NGINX_SERVER_NAME
              value: {{ .Values.nginx.serverName | default "_" | quote }}
            - name: NGINX_CLIENT_MAX_BODY_SIZE
              value: {{ .Values.nginx.clientMaxBodySize | default "32M" | quote }}
            - name: NGINX_FASTCGI_CONNECT_TIMEOUT
              value: {{ .Values.nginx.fastcgi.connectTimeout | default "60s" | quote }}
            - name: NGINX_FASTCGI_SEND_TIMEOUT
              value: {{ .Values.nginx.fastcgi.sendTimeout | default "300s" | quote }}
            - name: NGINX_FASTCGI_READ_TIMEOUT
              value: {{ .Values.nginx.fastcgi.readTimeout | default "300s" | quote }}
            - name: WAIT_FOR_PHP_FPM
              value: "true"
            {{- if not .Values.app.multisiteMode }}
            - name: ROOT_REDIRECT
              value: {{ printf "/%s" (.Values.app.singleSite.consultationPath | default "main") | quote }}
            {{- else if .Values.nginx.rootRedirect }}
            - name: ROOT_REDIRECT
              value: {{ .Values.nginx.rootRedirect | quote }}
            {{- end }}

          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}

          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}

          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}

          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: static-files
              mountPath: /var/www/html/web
              readOnly: true
            {{- if .Values.persistence.assets.enabled }}
            - name: assets
              mountPath: /var/www/html/web/assets
              readOnly: true
            {{- end }}

        {{- with .Values.sidecarContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      volumes:
        - name: static-files
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  volumeClaimTemplates:
    {{- if .Values.persistence.runtime.enabled }}
    - metadata:
        name: runtime
        {{- with .Values.persistence.runtime.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.runtime.accessMode }}
        {{- if .Values.persistence.runtime.storageClass }}
        {{- if (eq "-" .Values.persistence.runtime.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.persistence.runtime.storageClass | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.runtime.size | quote }}
    {{- end }}
    {{- if .Values.persistence.assets.enabled }}
    - metadata:
        name: assets
        {{- with .Values.persistence.assets.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.assets.accessMode }}
        {{- if .Values.persistence.assets.storageClass }}
        {{- if (eq "-" .Values.persistence.assets.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.persistence.assets.storageClass | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.assets.size | quote }}
    {{- end }}
