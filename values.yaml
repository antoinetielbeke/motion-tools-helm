# Default values for motion-tools.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Container images
images:
  php:
    repository: ghcr.io/antoinetielbeke/motion-tools-php
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  nginx:
    repository: ghcr.io/antoinetielbeke/motion-tools-nginx
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 33
  # runAsUser: 33
  # runAsGroup: 33
  # runAsNonRoot: true

securityContext: {}
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: false
  # allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: motion.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: motion-tools-tls
  #    hosts:
  #      - motion.local

# NGINX container health probes (HTTP on port 80)
livenessProbe:
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# Persistence configuration
# StatefulSet handles persistence through volumeClaimTemplates
persistence:
  runtime:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ""
    annotations: {}
  assets:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""
    annotations: {}

# Application configuration
app:
  # Required: Security seed for the application
  # Generate with: openssl rand -base64 32
  randomSeed: ""
  # Use existing secret for randomSeed
  existingSecretRandomSeed: ""
  randomSeedSecretKey: "random-seed"

  # Application settings
  domain: "motion.local"
  protocol: "https"
  baseLanguage: "en"
  multisiteMode: false
  runMigrations: true

  # Single-site mode settings (only used when multisiteMode is false)
  singleSite:
    subdomain: "std"
    title: "Demo Site"
    consultationPath: "main"
    consultationTitle: "Main Consultation"
    consultationTitleShort: "Main"

  # Mail configuration
  # Option 1: Symfony Mailer DSN (recommended)
  # e.g. "smtp://user:pass@host:587"
  mailerDsn: ""

  # Option 2: Individual SMTP settings (used to construct MAILER_DSN if mailerDsn is empty)
  smtp:
    enabled: false
    # host: "mail.example.com"
    # port: 587
    # username: "motiontool@example.com"
    # password: ""
    # encryption: "tls"
    # Use existing secret for SMTP password
    # existingSecret: ""
    # secretKey: "smtp-password"

  # Mail sender information
  mail:
    fromEmail: ""
    fromName: ""

  # OIDC / SSO Configuration
  # Enables Single Sign-On via OpenID Connect (e.g. Logto, Keycloak, Auth0)
  oidc:
    enabled: false
    # Required when enabled:
    clientId: ""
    clientSecret: ""
    issuer: ""  # e.g. "https://auth.example.com/oidc"
    # Use existing secret for OIDC credentials instead of inline values
    existingSecret: ""
    clientIdSecretKey: "oidc-client-id"
    clientSecretSecretKey: "oidc-client-secret"
    # Optional settings (sensible defaults provided by the container):
    redirectUri: ""            # Default: ${APP_PROTOCOL}://${APP_DOMAIN}/sso-callback
    scopes: ""                 # Default: "openid,profile,email"
    pkce: ""                   # Default: "true"
    singleLogout: ""           # Default: "true"
    syncGroups: ""             # Default: "false"
    discovery: ""              # Default: "true"
    # Link existing local accounts by email on first SSO login (migration helper).
    # Only safe when the IdP guarantees verified email addresses.
    linkByEmail: ""            # Default: "false"
    # Manual endpoint overrides (only needed if discovery is disabled):
    urlAuthorize: ""
    urlToken: ""
    urlUserinfo: ""
    urlLogout: ""
    # Attribute mapping overrides:
    attrEmail: ""              # Default: "email"
    attrUsername: ""            # Default: "preferred_username"
    attrGivenName: ""          # Default: "given_name"
    attrFamilyName: ""         # Default: "family_name"
    attrGroups: ""             # Default: "groups"
    # Group mapping (JSON string, sensitive - stored in secret):
    groupMapping: ""
    groupMappingSecretKey: "oidc-group-mapping"

  # Additional environment variables for the PHP-FPM container
  extraEnvVars: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

  # Additional environment variables from ConfigMaps or Secrets
  extraEnvFrom: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret

# NGINX container configuration
nginx:
  # Root path redirect (auto-set in single-site mode, configurable in multisite)
  rootRedirect: ""
  serverName: "_"
  clientMaxBodySize: "32M"
  fastcgi:
    connectTimeout: "60s"
    sendTimeout: "300s"
    readTimeout: "300s"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# PHP-FPM container resources
php:
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi

# Valkey configuration (Redis-compatible in-memory data store) - CloudPirates chart
valkey:
  enabled: false
  # Number of Valkey replicas
  replicaCount: 1

  # Authentication settings
  auth:
    enabled: true
    password: "changeme"
    # Use existing secret for password
    existingSecret: ""
    existingSecretPasswordKey: "password"

  # Valkey configuration
  config:
    maxMemory: "256mb"
    maxMemoryPolicy: "allkeys-lru"
    save: "900 1 300 10 60 10000"
    extraConfig: []

  # Resource limits and requests
  resources:
    limits:
      memory: 256Mi
      cpu: 250m
    requests:
      memory: 128Mi
      cpu: 100m

  # Persistence configuration
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
    accessModes:
      - ReadWriteOnce

  # Service configuration
  service:
    type: ClusterIP
    port: 6379

  # Security context
  podSecurityContext:
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# MariaDB configuration (CloudPirates chart)
mariadb:
  enabled: true
  auth:
    enabled: true
    rootPassword: "changeme"
    database: "antragsgruen"
    username: "antragsgruen"
    password: "changeme"
    # Use existing secret for passwords
    existingSecret: ""
    allowEmptyRootPassword: ""
    secretKeys:
      rootPasswordKey: mariadb-root-password
      userPasswordKey: mariadb-password
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m

# External database configuration (when mariadb.enabled is false)
externalDatabase:
  host: ""
  port: 3306
  database: "antragsgruen"
  username: "antragsgruen"
  password: ""
  existingSecret: ""
  userPasswordKey: "db-password"

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}

# Additional volumes
extraVolumes: []
# - name: extra-volume
#   configMap:
#     name: extra-configmap

# Additional volume mounts for the PHP-FPM container
extraVolumeMounts: []
# - name: extra-volume
#   mountPath: /extra
#   readOnly: true

# Additional init containers
initContainers: []

# Additional sidecar containers
sidecarContainers: []

# Network policy
# recommended for production
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# Priority class name
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []

# Update strategy for StatefulSet
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

# Revision history limit
revisionHistoryLimit: 10

# Enable debug mode
debug: false

# Additional labels
labels: {}

# Additional annotations
annotations: {}
